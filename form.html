<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="Product Review –  This is a product review page with form for client review input." />
  <meta name="author" content="Akpakpan Nsisong Ekwere" />
  <title>Product Review Form</title>

  <link rel="stylesheet" href="styles/form.css">

  <script src="scripts/form.js" defer></script>
</head>
<body>

  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">

      <div class="form-group">
        <label for="productName">Product Name</label>

        <select id="productName" name="productName" required>
          <option value="" disabled selected>
            Select a Product ...
          </option>
        </select>
      </div>

      <fieldset class="form-group">
        <legend>Overall Rating</legend>

        <div class="rating">

          <input type="radio" id="star1" name="rating" value="1" required>
          <label for="star1">☆</label>

          <input type="radio" id="star2" name="rating" value="2" required>
          <label for="star2">☆☆</label>

          <input type="radio" id="star3" name="rating" value="3" required>
          <label for="star3">☆☆☆</label>

          <input type="radio" id="star4" name="rating" value="4" required>
          <label for="star4">☆☆☆☆</label>

          <input type="radio" id="star5" name="rating" value="5" required>
          <label for="star5">☆☆☆☆☆</label>

        </div>
      </fieldset>

      <div class="form-group">
        <label for="installDate">Date of Installation</label>

        <input
          type="date"
          id="installDate"
          name="installDate"
          required>
      </div>

      <fieldset class="form-group">
        <legend>Useful Features</legend>

        <div class="checkbox-group">
          <input type="checkbox" id="durability" name="features" value="Durability"> <label for="durability">Durability</label> 
          <input type="checkbox" id="ease" name="features" value="Ease of Use"> <label for="ease">Ease of Use</label> 
          <input type="checkbox" id="performance" name="features" value="Performance"> <label for="performance">Performance</label> 
          <input type="checkbox" id="design" name="features" value="Design"> <label for="design">Design</label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="review">
          Written Review (Optional)
        </label>

        <textarea
          id="review"
          name="review"
          rows="5"
          placeholder="Write your review here..."></textarea>
      </div>

      <div class="form-group">
        <label for="username">
          Your Name (Optional)
        </label>

        <input
          type="text"
          id="username"
          name="username">
      </div>

      <input
        type="submit"
        value="Submit Review"
        class="submit-btn">

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Product Review Assignment</p>
  </footer>

</body>
</html>
